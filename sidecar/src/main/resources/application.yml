server:
  port: ${SIDECAR_PORT:9090}

sidecar:
  source: ${HOSTNAME:unknown}
  signals-topic: ${SIDECAR_SIGNALS_TOPIC:signals.raw}
  queue-capacity: ${SIDECAR_QUEUE_CAPACITY:10000}
  spill-dir: ${SIDECAR_SPILL_DIR:/tmp/sidecar-spill}
  max-spill-bytes: ${SIDECAR_MAX_SPILL_BYTES:104857600}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    acks: all
    enable-idempotence: true
server:
  port: 8081

spring:
  application:
    name: sentinel
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: sentinel
    password: sentinel
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: redis
      port: 6379

kafka:
  bootstrap-servers: kafka:9092
  consumer:
    group-id: sentinel-signals
    auto-offset-reset: earliest
    enable-auto-commit: false
    max-poll-records: 500
    poll-timeout: 3s
    pause-between-polls: 100ms
    shutdown-timeout: 10s
    max-attempts: 3
    retry-backoff: 500ms
  topics:
    - name: signals.raw
      partitions: 6
      replication-factor: 1
    - name: incidents.enrichment
      partitions: 1
      replication-factor: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

sentinel:
  dedup:
    ttl: 24h
  detection:
    window: 60
    threshold: 5
    max-recent-messages: 5
    reenrich-multiplier: 3
  llm:
    provider: ollama
    max-attempts: 3
    retry-backoff: 5s